events { worker_connections 1024; }
http {
    server_tokens off;
    # Coordinate URLs and authorization headers are not written to access logs.
    access_log off;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    client_max_body_size 60m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # No HSTS on localhost: it would also force unrelated local HTTP services to TLS.
    server {
        listen 8080;
        server_name localhost;
        return 308 https://localhost:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        server_name localhost;
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host localhost:8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host localhost:8443;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
    server {
        listen 8444 ssl;
        server_name localhost;
        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host localhost:8444;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host localhost:8444;
            proxy_set_header X-Forwarded-Port 8444;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
    server {
        listen 8445 ssl;
        server_name localhost;
        location / {
            proxy_pass http://host.docker.internal:5175;
            proxy_set_header Host localhost:5175;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
