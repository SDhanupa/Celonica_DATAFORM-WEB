# Project name: celonica-web
# Run with: docker compose up -d

services:
  # ─── Frontend (React / Vite) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: celonica-web-frontend
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - celonica_net

  # ─── Backend (Laravel / PHP-FPM) ────────────────────────────
  backend:
    build:
      context: ./backend
    deploy:
      replicas: 3
    depends_on:
      - db
      - keycloak
      - redis
    restart: unless-stopped
    environment:
      - APP_NAME=Celonica Admin
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:?Set APP_KEY in the private .env file}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=celonica_db
      - DB_USERNAME=celonica_user
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the private .env file}
      - KEYCLOAK_BASE_URL=http://celonica-web-keycloak:8080
      - KEYCLOAK_PUBLIC_URL=${KC_HOSTNAME_URL:-http://localhost:8081}
      # Must match the realm actually imported by keycloak/celonica-admin-realm.json
      # ("celonica", no "y") — this previously said "ceylonica-admin", which does
      # not exist locally, so every keycloak.admin-gated route 401'd/failed JWKS
      # lookup regardless of token validity. Override per-environment if a real
      # deployment target uses different values.
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-celonica-admin}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-celonica-frontend}
      - KEYCLOAK_API_AUDIENCE=${KEYCLOAK_API_AUDIENCE:-ceylonica-api}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in the private .env file}
      - FRONTEND_URL=${FRONTEND_URL:-https://ceystem.com}
      - SUPER_ADMIN_KEYCLOAK_SUB=51050c63-27d4-40ff-9474-fa4d2ce6a6be
      # Laravel 11+ reads CACHE_STORE (CACHE_DRIVER is ignored); without this the
      # cache silently fell back to the database store even though Redis was up.
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - REDIS_CLIENT=phpredis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=sync
      - TEXTWARE_USERNAME=${TEXTWARE_USERNAME}
      - TEXTWARE_PASSWORD=${TEXTWARE_PASSWORD}
      - TEXTWARE_SENDER_ID=${TEXTWARE_SENDER_ID}
      - TEXTWARE_API_URL=${TEXTWARE_API_URL}
    volumes:
      - backend_uploads:/var/www/public/uploads
      - backend_storage:/var/www/storage
    networks:
      - celonica_net

  # ─── Redis Caching ──────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: celonica-web-redis
    restart: unless-stopped
    networks:
      - celonica_net

  # ─── PostgreSQL for Laravel ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: celonica-web-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: celonica_db
      POSTGRES_USER: celonica_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - celonica_net

  # ─── PostgreSQL for Keycloak ───────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: celonica-web-keycloakdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - celonica_net

  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    container_name: celonica-web-keycloak
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak_db}
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_INITIAL_USER_PASSWORD: ${KEYCLOAK_INITIAL_USER_PASSWORD:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KC_HOSTNAME_URL:-http://localhost:8081}
      KC_CACHE: local
    ports:
      - "127.0.0.1:${KC_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes/ceylonica:/opt/keycloak/themes/ceylonica
      - ./keycloak/providers:/opt/keycloak/providers
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - celonica_net

volumes:
  keycloak_db_data:
    name: celonica-web-keycloak-db-data
  postgres_data:
    name: celonica-web-postgres-data
  backend_uploads:
    name: celonica-web-backend-uploads
  backend_storage:
    name: celonica-web-backend-storage

networks:
  celonica_net:
    name: celonica-web-network
    driver: bridge

