# Loopback-only HTTPS rehearsal. Never apply this file to the hosted server.
services:
  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://localhost:8443
      FRONTEND_URL: https://localhost:8443
      KEYCLOAK_PUBLIC_URL: https://localhost:8444
      LOG_LEVEL: warning
    # Preserve the no-migration/no-seed local entrypoint and all database volumes.
  frontend:
    volumes:
      - ./.local/secure-frontend:/usr/share/nginx/html:ro
  keycloak:
    command: ["start"]
    environment:
      KC_HOSTNAME_URL: https://localhost:8444
      KC_HOSTNAME_ADMIN_URL: https://localhost:8444
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      CEYLONICA_LOGIN_URL: https://localhost:8443/login
  secure-gateway:
    image: nginx:alpine
    container_name: celonica-local-https
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:8080"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
    volumes:
      - ./deploy/local/https.conf:/etc/nginx/nginx.conf:ro
      - ${LOCAL_TLS_DIR:?Run local HTTPS setup first}:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      - frontend
      - keycloak
    networks:
      - celonica_net
